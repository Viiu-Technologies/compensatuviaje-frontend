  const stop = { x: LEDGER.x, y: LEDGER.y - 1, w: 3, d: LEDGER.d + 2, r: 0.8 };

var SEAL_AT = 3.9;

  return {
    carriage: lerp(TILE_X[prev.project], TILE_X[leg2.project], choose),
    tiles,

      part3("carriage", carriage(), [pose.carriage, 0, 0]),
      pressBack(),
      cable2(),
      bed(),

      part3("seal", seal(), [0, 0, 0], ` opacity="${pose.seal.toFixed(2)}"`),

function apply3(svg, clock) {

  pose.tiles.forEach((dz, i) => q(`tile-${i}`).setAttribute("transform", translateAlong(P3, [0, 0, dz])));

var FIGURES = {

var params = new URLSearchParams(location.search);
var frozen = params.has("t") ? Number(params.get("t")) : null;
var still = params.has("still");
var only = params.get("only");
var main = document.querySelector("main");
var kinds = Object.keys(FIGURES).filter((kind) => !only || kind === only);
var cards = kinds.map((kind) => {
  const card2 = document.createElement("div");
  card2.className = "card";
  card2.dataset.kind = kind;
  card2.innerHTML = `${FIGURES[kind].figure()}<p></p>`;
  main.appendChild(card2);
  return { kind, svg: card2.querySelector("svg"), readout: card2.querySelector("p") };
});
function frame(now) {
  const clock = clockAt(frozen ?? now / 1e3, still);
  for (const card2 of cards) card2.readout.textContent = FIGURES[card2.kind].apply(card2.svg, clock);
  if (frozen === null && !still) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
