# Headers de seguridad de vercel.json. Se incluye en cada location porque nginx
# no hereda add_header del server si la location define los suyos.
# Obliga a usar HTTPS durante un año. Sin includeSubDomains ni preload: no está
# verificado que todos los subdominios sirvan HTTPS, y preload es difícil de revertir.
# Sobre HTTP el navegador lo ignora, así que es inocuo si nginx queda tras un proxy TLS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Vacío = no se envía.
add_header X-Robots-Tag $robots_tag always;
