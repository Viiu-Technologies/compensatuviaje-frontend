# Headers de seguridad de vercel.json. Se incluye en cada location porque nginx
# no hereda add_header del server si la location define los suyos.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Vacío = no se envía.
add_header X-Robots-Tag $robots_tag always;
# Vacío = no se envía (HTML del backend). Ver el map $csp_report_only en default.conf.template.
add_header Content-Security-Policy-Report-Only $csp_report_only always;
