# Construye la imagen del frontend (Vite + nginx) y la publica en GHCR.
# Coolify en la VPS solo la descarga y la despliega. Vercel no usa este workflow.
#
# Las VITE_* se incrustan en el bundle al compilar, así que salen de las
# variables del repositorio (Settings → Secrets and variables → Actions →
# Variables). Son valores públicos (terminan en el navegador), no secretos.
#
# Tags: `develop` / `main` (la última de cada rama) y `sha-<commit>` (para rollback).

name: Imagen Docker

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Imagen del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/compensatuviaje-frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_API_URL=${{ vars.VITE_APP_API_URL }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_BLOCKCHAIN_NETWORK=${{ vars.VITE_BLOCKCHAIN_NETWORK }}
            VITE_CONTRACT_ADDRESS_POLYGON=${{ vars.VITE_CONTRACT_ADDRESS_POLYGON }}
