<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/images/brand/logo-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/brand/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/brand/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08AE06" />
    <meta name="description" content="CompensaTuViaje - Plataforma de compensación de huella de carbono" />
    <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png" />
    <title>CompensaTuViaje</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts — Outfit (display del branding, --ctv-font-display / --font-display)
         + Inter (texto, --ctv-font-body / --font-sans) + JetBrains Mono (--font-mono).
         Mantener sincronizado con src/apps/public/components/landing/tokens.css
         y src/index.css: una familia declarada en CSS que falte aquí cae a fallback
         de forma silenciosa. Pesos limitados a los que el código usa realmente. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'; this.onload=null;" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>
    <!-- Preload logo -->
    <link rel="preload" as="image" type="image/jpeg" href="/images/brand/new-brand/logo-rectangular.jpeg" />
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
